name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build, all tests and app download
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AMSpeedUp.sln

      - name: Build
        run: dotnet build AMSpeedUp.sln -c Release --no-restore

      - name: Test
        run: dotnet test AMSpeedUp.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # Lists each failed test on the run's summary page and as an annotation on the pull request.
      - name: Show failed tests
        if: failure()
        shell: pwsh
        run: |
          function Escape([string]$value, [switch]$property) {
            $value = $value -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            if ($property) { $value = $value -replace ':', '%3A' -replace ',', '%2C' }
            return $value
          }
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          foreach ($file in Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue) {
            [xml]$trx = Get-Content $file.FullName -Raw
            foreach ($info in Select-Xml -Xml $trx -XPath '//t:RunInfo' -Namespace $ns) {
              $text = $info.Node.Text
              Write-Output "::warning title=$(Escape "Test run note ($($file.Name))" -property)::$(Escape $text)"
            }
            foreach ($result in Select-Xml -Xml $trx -XPath '//t:UnitTestResult[@outcome="Failed"]' -Namespace $ns) {
              $node = $result.Node
              $message = [string]$node.Output.ErrorInfo.Message
              $stack = [string]$node.Output.ErrorInfo.StackTrace
              $shortStack = ($stack -split "`n" | Select-Object -First 6) -join "`n"
              Write-Output "::error title=$(Escape "Test failed: $($node.testName)" -property)::$(Escape "$message`n$shortStack")"
              "### $($node.testName)`n``````text`n$message`n$stack`n``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }

      - name: Publish single-file app
        run: dotnet publish src/AMSpeedUp -c Release -o publish

      # Download this from the run's Summary page to test a build without installing anything.
      - name: Upload AMSpeedUp.exe
        uses: actions/upload-artifact@v5
        with:
          name: AMSpeedUp-exe
          path: publish/AMSpeedUp.exe
          if-no-files-found: error
          retention-days: 14

  core-on-linux:
    # Proves AMSpeedUp.Core stays free of Windows-only code.
    name: Core tests on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test Core
        run: dotnet test tests/AMSpeedUp.Tests -c Release
