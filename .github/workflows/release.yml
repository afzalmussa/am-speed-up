name: Release

# Push a tag like v0.1.0, or publish a release with a new tag from the Releases page,
# to build AMSpeedUp.exe and attach it to the GitHub Release.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

# Publishing from the Releases page can start this twice (the new tag and the release), so the
# second run waits for the first and then just replaces the same files.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Work out the version from the tag
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:TAG' should look like v1.2.3 or v1.2.3-beta.1"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test AMSpeedUp.sln -c Release -p:Version=${{ env.VERSION }} --logger GitHubActions --filter "Category!=VendorDownload"

      - name: Publish single-file app
        run: dotnet publish src/AMSpeedUp -c Release -p:Version=${{ env.VERSION }} -o publish

      # The file name must stay AMSpeedUp.exe so the "latest download" link never breaks.
      - name: Check the file name and write a checksum
        shell: pwsh
        run: |
          $exe = 'publish/AMSpeedUp.exe'
          if (-not (Test-Path $exe)) { throw "publish/AMSpeedUp.exe was not produced" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AMSpeedUp.exe" | Out-File publish/AMSpeedUp.exe.sha256 -Encoding ascii -NoNewline

      # The release may already exist if it was published from the Releases page, which also
      # creates the tag. Then the files are added to it; otherwise the release is created here.
      - name: Create the GitHub Release or add the files to it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @('publish/AMSpeedUp.exe', 'publish/AMSpeedUp.exe.sha256')
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            $flags = @('--title', $env:TAG, '--generate-notes')
            if ($env:VERSION.Contains('-')) { $flags += '--prerelease' }
            gh release create $env:TAG @files @flags
          }
          if ($LASTEXITCODE -ne 0) { throw "Couldn't publish the files to release $env:TAG" }
